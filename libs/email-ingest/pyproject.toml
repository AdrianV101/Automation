[project]
name = "email-ingest"
version = "0.1.0"
description = "Source-agnostic IMAP IDLE + DKIM + MIME primitives for email-driven ingestion pipelines"
requires-python = ">=3.11"
dependencies = [
    "aioimaplib>=1.1.0",
    "aiosqlite>=0.19.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
