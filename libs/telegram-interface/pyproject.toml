[project]
name = "telegram-interface"
version = "0.1.0"
description = "Telegram bot with agent-powered commands and trace streaming"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "aiosqlite>=0.19.0",
    "agent-infra",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv.sources]
agent-infra = { path = "../agent-infra", editable = true }
