[project]
name = "automation-daemon"
version = "0.1.0"
description = "Automation daemon — thin orchestrator over Plaud/agent/telegram/email/news libraries, routing to PKM"
requires-python = ">=3.11"
dependencies = [
    "agent-infra",
    "telegram-interface",
    "pkm",
    "email-ingest",
    "news-pipeline",
    "httpx>=0.27",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "aiosqlite>=0.19.0",
    "claude-agent-sdk>=0.1.0",
    "psutil>=5.9",
    "pyyaml>=6.0",
    "markdownify>=0.13",
    "beautifulsoup4>=4.12",
    "watchdog>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
]
[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
agent-infra = { path = "../libs/agent-infra", editable = true }
telegram-interface = { path = "../libs/telegram-interface", editable = true }
pkm = { path = "../libs/pkm", editable = true }
email-ingest = { path = "../libs/email-ingest", editable = true }
news-pipeline = { path = "../libs/news-pipeline", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: tests that call real external APIs (deselect with '-m not integration')",
    "real_dotenv: opt out of the _isolate_dotenv autouse no-op to exercise real .env-file loading",
]
